name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
          fallback: none

      - name: Add Zola to PATH
        run: echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"

      - name: Verify Zola
        run: zola --version

      - name: Check internal links
        working-directory: site
        run: zola check --skip-external-links

      - name: Build site
        working-directory: site
        run: zola build --output-dir ../docs --force

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
